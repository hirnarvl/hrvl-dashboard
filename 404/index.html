<!--
  Cleaned 404 page
  Removed: extraction header, TABLE OF CONTENTS, RSC payloads, JS/data dumps, and other debug/developer output that were present in the original file.
  Purpose: minimal, safe 404 page for production.
-->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>404 — Page Not Found</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --muted: #475569;
      --accent: #2563eb;
      --shadow: 0 8px 24px rgba(2,6,23,0.08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --card: #0b1220;
        --muted: #94a3b8;
        --accent: #3b82f6;
        --shadow: 0 8px 24px rgba(2,6,23,0.6);
      }
      html,body {color: #e6eef8}
    }
    html, body {
      height: 100%;
      margin: 0;
      background: linear-gradient(180deg, var(--bg), #eef2ff);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--card);
      padding: 28px;
      border-radius: 12px;
      box-shadow: var(--shadow);
      max-width: 820px;
      width: 100%;
      display: flex;
      gap: 24px;
      align-items: center;
    }
    .branding {
      width: 88px;
      height: 88px;
      flex: 0 0 88px;
      border-radius: 10px;
      background: linear-gradient(135deg,#e6f0ff,#fff);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .branding img { width: 64px; height: 64px; object-fit: contain; display:block }
    .content {
      flex: 1;
      min-width: 0;
    }
    h1 {
      margin: 0 0 6px 0;
      font-size: 52px;
      line-height: 1;
      letter-spacing: -1px;
    }
    p.lead {
      margin: 0 0 12px 0;
      color: var(--muted);
      font-size: 16px;
    }
    .actions {
      display:flex;
      gap:12px;
      margin-top: 8px;
    }
    .btn {
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:10px 14px;
      border-radius:8px;
      text-decoration:none;
      font-weight:600;
      color: white;
      background: var(--accent);
      border: none;
      cursor: pointer;
    }
    .btn.ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid rgba(15,23,42,0.06);
      font-weight: 600;
    }
    .meta { color: var(--muted); font-size: 13px; margin-top: 8px; }
    @media (max-width:720px) {
      .card { flex-direction: column; text-align: center; padding: 20px }
      .branding { margin-bottom: 6px }
      h1 { font-size: 42px }
    }
  </style>
</head>
<body>
  <div class="wrap" role="main">
    <div class="card" role="article" aria-labelledby="title-404">
      <div class="branding" aria-hidden="true">
        <!-- Keep a reference to repo logo if present in site assets -->
        <img src="/hrvl-logo-new.png" alt="HRVL Logo" onerror="this.style.display='none'"/>
      </div>
      <div class="content">
        <h1 id="title-404">404</h1>
        <p class="lead">Sorry — the page you requested could not be found.</p>
        <div class="actions" role="navigation" aria-label="404 actions">
          <a class="btn" href="/" title="Return to home">Return to home</a>
          <a class="btn ghost" href="https://github.com/hirnarvl/hrvl-dashboard" target="_blank" rel="noopener noreferrer">Project on GitHub</a>
        </div>
        <p class="meta">If you believe this is an error, please check the URL or contact the site administrator.</p>
      </div>
    </div>
  </div>
</body>
</html>
